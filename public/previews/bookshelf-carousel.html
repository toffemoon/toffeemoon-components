<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>书架轮播 · Bookshelf</title>
<style>
  :root { --acc: #e4ff3b; --ink: #f3efe6; --dim: rgba(243,239,230,0.45); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0b0c10; color: var(--ink); overflow: hidden;
    font-family: "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { outline: none; }

  /* 外壳:进场淡入 */
  .ui { position: fixed; opacity: 0; transition: opacity .5s ease .2s; pointer-events: none; }
  body.ready .ui { opacity: 1; }
  .ui > *, .ui.arrow { pointer-events: auto; }

  /* 左上返回 */
  #back { top: 22px; left: 26px; }
  #back a { display: grid; place-items: center; width: 56px; height: 40px; border: 3px solid #e0331f; border-radius: 12px;
    color: #e0331f; font-weight: 900; text-decoration: none; font-size: 20px; background: rgba(0,0,0,0.35); }

  /* 右上徽标 */
  #badge { top: 20px; right: 26px; display: flex; align-items: stretch; border: 2px solid #d9d5cc; border-radius: 10px; overflow: hidden; background: #f3efe6; color: #111; min-width: 320px; }
  #badge .icon { width: 72px; background: #111; display: grid; place-items: center; }
  #badge .icon i { display: block; width: 30px; height: 30px; border: 3px solid #f3efe6; border-bottom: none; border-radius: 15px 15px 0 0; }
  #badge .text { flex: 1; padding: 6px 14px 6px 12px; display: grid; align-content: center; }
  #badge-row { font-size: 12px; letter-spacing: .18em; font-weight: 800; }
  #badge-title { font-size: 18px; font-weight: 900; margin-top: 2px; background: #111; color: #f3efe6; padding: 3px 8px; white-space: nowrap; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }

  /* 左右箭头 */
  .arrow { top: 50%; transform: translateY(-50%); font-size: 44px; font-weight: 900; color: var(--ink); user-select: none; cursor: pointer; padding: 10px 14px; line-height: 1; }
  .arrow.dim { opacity: .25; cursor: default; }
  #prev { left: 36px; } #next { right: 36px; }
  .arrow::after { content: ''; position: absolute; top: 50%; width: 0; height: 0; border: 7px solid transparent; transform: translateY(-50%); }
  #prev::after { left: 60px; border-right-color: #e0331f; } #next::after { right: 60px; border-left-color: #e0331f; }

  /* 底部页签 */
  #tabs { right: 40px; bottom: 22px; display: flex; border: 2px solid #cfcbc2; border-radius: 10px; background: rgba(12,12,14,0.9); padding: 4px; gap: 2px; }
  #tabs button { appearance: none; border: 0; background: transparent; color: var(--ink); font-family: inherit; font-style: italic; font-weight: 900; font-size: 18px; line-height: 1; padding: 12px 34px; cursor: pointer; border-radius: 6px; transform: skewX(-8deg); }
  #tabs button.active { background: var(--acc); color: #111; }
  #tabs button:disabled { color: var(--dim); cursor: default; }

  /* 顶部中心标记:这下面那本就是选中 */
  #marker { z-index: 2; top: 14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border: 12px solid transparent; border-top: 14px solid var(--acc); border-bottom: 0; filter: drop-shadow(0 2px 0 rgba(0,0,0,.6)); }

  /* 翻开后的说明 */
  #caption { left: 36px; bottom: 90px; max-width: 380px; opacity: 0; transform: translateY(8px); transition: .35s ease; border-left: 4px solid var(--acc); padding: 8px 14px; background: rgba(0,0,0,0.45); }
  #caption.show { opacity: 1; transform: none; }
  #caption.pulse { border-left-color: #fff; }
  #caption-title { font-size: 20px; font-weight: 900; }
  #caption-sub { font-size: 13px; color: var(--dim); margin-top: 4px; }

  /* 提示 + 模式 */
  #hint { left: 36px; bottom: 26px; font-size: 12px; color: var(--dim); letter-spacing: .04em; display: flex; gap: 16px; align-items: center; }
  #mode { appearance: none; border: 1px solid var(--dim); background: transparent; color: var(--dim); font: inherit; padding: 4px 10px; cursor: pointer; border-radius: 4px; }
  body.transitioning .arrow, body.transitioning #tabs { pointer-events: none; }

  @media (max-width: 720px) {
    #badge { min-width: 0; right: 14px; top: 14px; transform: scale(.85); transform-origin: top right; }
    #back { top: 14px; left: 14px; transform: scale(.85); transform-origin: top left; }
    #prev { left: 6px; } #next { right: 6px; }
    #tabs { right: 10px; bottom: 12px; } #tabs button { padding: 10px 16px; font-size: 15px; }
    #hint { display: none; } #caption { bottom: 80px; left: 14px; }
    #marker { top: 78px; }
  }
